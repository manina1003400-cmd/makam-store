<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>MAKAM - الدردشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="chat">
<div class="promo-bar" id="promoBanner">🚚 توصيل سريع لـ 58 ولاية • الدفع نقداً عند الاستلام 💯</div>
<header>
  <div class="header-top">
    <div class="logo" id="storeName">🛍️ MAKAM</div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل المظهر">🌙</button>
      <button class="cart-btn" onclick="openCart()">
        <span class="cart-count" id="cartCount">0</span> 🛒 السلة
      </button>
    </div>
  </div>
</header>
<!-- Client Chat Modal -->
<div class="modal page-mode show" id="clientChatModal">
  <div class="modal-content">
    <div class="modal-header"><h2>💬 الدردشة المباشرة</h2><button class="close-btn" onclick="closeClientChat()">×</button></div>
    <div id="clientNameArea" style="margin-bottom: 12px;">
      <input type="text" id="chatClientName" placeholder="اكتب اسمك هنا للبدء..." style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: 700; background:var(--surface-2); color:var(--text);">
    </div>
    <div class="chat-container">
      <div class="chat-messages" id="clientChatMessages"></div>
      <div class="chat-input-area">
        <input type="text" id="clientChatInput" placeholder="اكتب استفسارك هنا..." onkeypress="if(event.key==='Enter')sendClientMessage()">
        <button type="button" onclick="sendClientMessage()">إرسال</button>
      </div>
    </div>
  </div>
</div>
<div class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span> الرئيسية </a>
  <a class="nav-item" href="cart.html"><span class="icon">🛒</span> السلة <span id="bottomCartCount" class="nav-badge">0</span></a>
  <a class="nav-item" href="orders.html"><span class="icon">📦</span> طلباتي <span id="myOrdersCount" class="nav-badge">0</span></a>
  <a class="nav-item active" href="chat.html"><span class="icon">💬</span> الدردشة </a>
  <a class="nav-item" href="contact.html"><span class="icon">📞</span> اتصل بنا </a>
</div>

<div class="toast" id="toast">✓</div>
<script src="app.js"></script>
</body>
</html>
