<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>MAKAM - السلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
<div class="promo-bar" id="promoBanner">🚚 توصيل سريع لـ 58 ولاية • الدفع نقداً عند الاستلام 💯</div>
<header>
  <div class="header-top">
    <div class="logo" id="storeName">🛍️ MAKAM</div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل المظهر">🌙</button>
      <button class="cart-btn" onclick="openCart()">
        <span class="cart-count" id="cartCount">0</span> 🛒 السلة
      </button>
    </div>
  </div>
</header>
<!-- Cart Modal -->
<div class="modal page-mode show" id="cartModal">
  <div class="modal-content">
    <div class="modal-header"><h2>🛒 سلة التسوق</h2><button class="close-btn" onclick="closeCart()">×</button></div>
    <div id="cartItems"></div>
  </div>
</div>
<div class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span> الرئيسية </a>
  <a class="nav-item active" href="cart.html"><span class="icon">🛒</span> السلة <span id="bottomCartCount" class="nav-badge">0</span></a>
  <a class="nav-item" href="orders.html"><span class="icon">📦</span> طلباتي <span id="myOrdersCount" class="nav-badge">0</span></a>
  <a class="nav-item" href="chat.html"><span class="icon">💬</span> الدردشة </a>
  <a class="nav-item" href="contact.html"><span class="icon">📞</span> اتصل بنا </a>
</div>

<div class="toast" id="toast">✓</div>
<script src="app.js"></script>
</body>
</html>
